<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Big House BluePrint — Home Inventory</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
      "firebase/storage": "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js"
    }
  }
  </script>
</head>
<body>
  <header class="app-header">
    <div class="header-banner">
      <a href="#" id="brand-link"><img src="img/logo-banner.webp" alt="Big House BluePrint" class="banner-logo"></a>
    </div>
    <div class="header-nav-bar">
      <nav class="nav-tabs" id="nav-tabs" style="display:none">
        <button class="nav-tab active" data-route="dashboard">Dashboard</button>
        <button class="nav-tab" data-route="rooms">Rooms</button>
        <button class="nav-tab" data-route="equipment">Equipment</button>
        <button class="nav-tab" data-route="maintenance">Maintenance</button>
        <button class="nav-tab" data-route="settings">Settings</button>
      </nav>
      <div id="app-header-signed-in" class="header-actions" style="display:none">
        <button class="btn ghost" id="properties-nav-btn">Properties <span id="notification-badge" class="badge danger" style="display:none"></span></button>
        <button class="btn ghost" id="signout-btn">Sign out</button>
      </div>
    </div>
  </header>

  <main id="main" class="app-main"></main>

  <div id="modal-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
